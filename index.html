<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Ứng dụng Quản lý công việc - MVP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5" style="max-width: 600px;">
    <h3 class="text-primary fw-bold mb-3">Ứng dụng MVP (Demo CI/CD)</h3>
    <div class="input-group mb-3">
        <input type="text" id="taskInput" class="form-control" placeholder="Nhập công việc mới...">
        <button class="btn btn-primary" onclick="addTask()">Thêm</button>
    </div>
    <ul id="taskList" class="list-group shadow-sm"></ul>
</div>

<script>
    let tasks = JSON.parse(localStorage.getItem('tasks')) || ['Học deploy hosting', 'Test tính năng CI/CD'];
    function render() {
        localStorage.setItem('tasks', JSON.stringify(tasks));
        document.getElementById('taskList').innerHTML = tasks.map((t, i) => `
            <li class="list-group-item d-flex justify-content-between align-items-center">
                <span>${t}</span>
                <button class="btn btn-sm btn-danger" onclick="delTask(${i})">Xóa</button>
            </li>
        `).join('');
    }
    function addTask() {
        const val = document.getElementById('taskInput').value.trim();
        if (val) { tasks.unshift(val); document.getElementById('taskInput').value = ''; render(); }
    }
    function delTask(i) { tasks.splice(i, 1); render(); }
    render();
</script>
</body>
</html>
