<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý công việc</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .card { border-radius: 12px; }
        .list-group-item { border-left: none; border-right: none; }
    </style>
</head>
<body class="py-5">

<div class="container" style="max-width: 600px;">
    <div class="card shadow-sm border-0 p-4 bg-white">
        <h3 class="fw-bold mb-4 text-center text-primary">Quản Lý Công Việc</h3>

        <!-- Ô nhập công việc mới -->
        <div class="input-group mb-4">
            <input type="text" id="taskInput" class="form-control" placeholder="Nhập tên công việc...">
            <button class="btn btn-primary px-4" onclick="addTask()">Thêm</button>
        </div>

        <!-- Danh sách công việc -->
        <ul id="taskList" class="list-group list-group-flush"></ul>
    </div>
</div>

<script>
    let tasks = JSON.parse(localStorage.getItem('tasks')) || ['Làm báo cáo đồ án', 'Chuẩn bị slide thuyết trình'];
    
    function render() {
        localStorage.setItem('tasks', JSON.stringify(tasks));
        const listEl = document.getElementById('taskList');
        
        if (tasks.length === 0) {
            listEl.innerHTML = `<li class="list-group-item text-center text-muted py-3">Chưa có công việc nào</li>`;
            return;
        }

        listEl.innerHTML = tasks.map((t, i) => `
            <li class="list-group-item d-flex justify-content-between align-items-center py-3">
                <span id="text-${i}" class="text-secondary">${t}</span>
                <div>
                    <button class="btn btn-sm btn-outline-warning me-2" onclick="editTask(${i})">Sửa</button>
                    <button class="btn btn-sm btn-outline-danger" onclick="delTask(${i})">Xóa</button>
                </div>
            </li>
        `).join('');
    }

    function addTask() {
        const input = document.getElementById('taskInput');
        const val = input.value.trim();
        if (val) { 
            tasks.unshift(val); 
            input.value = ''; 
            render(); 
        }
    }

    function delTask(i) { 
        tasks.splice(i, 1); 
        render(); 
    }

    function editTask(i) {
        const currentText = tasks[i];
        const newText = prompt("Chỉnh sửa nội dung công việc:", currentText);
        if (newText !== null) {
            const trimmed = newText.trim();
            if (trimmed !== "") {
                tasks[i] = trimmed;
                render();
            }
        }
    }

    document.getElementById('taskInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') addTask();
    });

    render();
</script>
</body>
</html>
