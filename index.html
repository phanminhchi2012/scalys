<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ứng dụng Quản lý công việc - MVP CI/CD</title>
    <!-- Thêm Google Fonts Inter và Bootstrap 5 -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
        }
        .card-custom {
            border: none;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }
        .list-group-item {
            border: none;
            border-bottom: 1px solid #f1f3f5;
            transition: all 0.2s ease;
        }
        .list-group-item:last-child {
            border-bottom: none;
        }
        .list-group-item:hover {
            background-color: #f8f9fa;
        }
    </style>
</head>
<body class="py-5">

<div class="container" style="max-width: 650px;">
    <div class="card card-custom p-4 bg-white">
        <div class="text-center mb-4">
            <span class="badge bg-primary bg-opacity-10 text-primary px-3 py-2 rounded-pill mb-2 fw-semibold">MVP Project - CI/CD Demo</span>
            <h2 class="fw-bold text-dark">Quản Lý Công Việc</h2>
            <p class="text-muted small">Hệ thống tự động cập nhật code qua GitHub & Vercel</p>
        </div>

        <!-- Ô nhập công việc -->
        <div class="input-group mb-4 shadow-sm rounded-pill overflow-hidden border">
            <input type="text" id="taskInput" class="form-control border-0 px-4 py-3 shadow-none" placeholder="Nhập công việc cần làm hôm nay...">
            <button class="btn btn-primary px-4 fw-semibold" onclick="addTask()">Thêm việc</button>
        </div>

        <!-- Danh sách công việc -->
        <div class="card border bg-light bg-opacity-50 rounded-4 p-2">
            <ul id="taskList" class="list-group list-group-flush bg-transparent"></ul>
        </div>
        
        <div class="text-center mt-4">
            <small class="text-muted">Phát triển bởi Phan Minh Chí - 2026</small>
        </div>
    </div>
</div>

<script>
    let tasks = JSON.parse(localStorage.getItem('tasks')) || ['Học deploy hosting Vercel', 'Kiểm tra tính năng CI/CD tự động'];
    
    function render() {
        localStorage.setItem('tasks', JSON.stringify(tasks));
        const listEl = document.getElementById('taskList');
        if (tasks.length === 0) {
            listEl.innerHTML = `<li class="text-center text-muted py-3">Chưa có công việc nào. Hãy thêm mới!</li>`;
            return;
        }
        listEl.innerHTML = tasks.map((t, i) => `
            <li class="list-group-item d-flex justify-content-between align-items-center py-3 px-3 bg-transparent">
                <span class="fw-medium text-secondary">${t}</span>
                <button class="btn btn-sm btn-outline-danger px-3 rounded-pill" onclick="delTask(${i})">Xóa</button>
            </li>
        `).join('');
    }

    function addTask() {
        const input = document.getElementById('taskInput');
        const val = input.value.trim();
        if (val) { 
            tasks.unshift(val); 
            input.value = ''; 
            render(); 
        }
    }

    function delTask(i) { 
        tasks.splice(i, 1); 
        render(); 
    }

    // Cho phép bấm phím Enter để thêm nhanh
    document.getElementById('taskInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            addTask();
        }
    });

    render();
</script>
</body>
</html>
